name: Edryx tests

on:
  push:
    branches: [main]
    paths:
      - 'edryx.py'
      - 'test_edryx.py'
      - '.github/workflows/edryx-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'edryx.py'
      - 'test_edryx.py'
      - '.github/workflows/edryx-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  edge-runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run Edryx tests
        run: python -m unittest test_edryx -v
